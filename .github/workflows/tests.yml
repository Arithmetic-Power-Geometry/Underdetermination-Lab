name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python experiments/continuous_coverage_validation.py
      - run: python experiments/cheapest_experiment.py
      - run: python experiments/derived_worlds.py
      - run: python experiments/end_to_end_planner.py
      - run: python experiments/ecd_adversarial_comparison.py
      - run: python experiments/ml_deployment_case.py
      - run: python experiments/sequential_ml_deployment.py
